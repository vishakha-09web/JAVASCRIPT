<!DOCTYPE html>
<html>
<head>
    <title>Multiplication</title>
</head>
<body>
    <h2>Multiplication of Two Numbers</h2>

    <script>
        var a = parseInt(prompt("Enter first number:"));
        var b = parseInt(prompt("Enter second number:"));

        var result = a * b;

        document.write("Multiplication = " + result);
    </script>
</body>
</html>
