<!DOCTYPE html>
<html>
<head>
    <title>Compare Two Strings</title>
</head>
<body>
    <h2>Compare Two Strings</h2>

    <script>
        var str1 = prompt("Enter first string:");
        var str2 = prompt("Enter second string:");

        if (str1 === str2) {
            document.write("Both strings are equal.");
        }
        else {
            document.write("Both strings are not equal.");
        }
    </script>
</body>
</html>
